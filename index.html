const EQN={h:'Halter',mq:'Máquina',po:'Polia',m:'Máquina / Polia',b:'Barra',c:'Corda'};

const ALIAS={'Supino inclinado com halteres':'Supino inclinado'};
const fk=v=>String(v).replace('.',',');
function gymRows(){
  const R=[];
  Object.keys(st.gy).forEach(k=>{
    const a=k.split('|');if(a.length!==3||!/^\d+$/.test(a[2]))return;
    const s=SM[a[0]];if(!s||!s.gym||!G[s.gym])return;const x=G[s.gym][1][+a[1]];if(!x)return;
    const v=st.gy[k];if(!Array.isArray(v))return;
    const r=parseFloat(String(v[0]||'').replace(',','.')),l=parseFloat(String(v[1]||'').replace(',','.'));
    if(!(r>0))return;
    const n=nm(x[0],s.w);
    R.push({id:a[0],i:+a[1],j:+a[2],n:n,c:ALIAS[n]||n,s:s,r:r,l:l>0?l:0,u:/min/.test(x[2])?'min':/\ss$/.test(x[2])?'s':'',eq:eqLabel(a[0],+a[1],n)});
  });
  return R;
}
function bestLoad(rows){let b=null;rows.forEach(x=>{if(x.l>0&&(!b||x.l>b.l||(x.l===b.l&&(x.r>b.r||(x.r===b.r&&x.s.ts>b.s.ts)))))b=x;});return b;}
function bestReps(rows){let b=null;rows.forEach(x=>{if(!b||x.r>b.r||(x.r===b.r&&x.l>b.l))b=x;});return b;}
const setTxt=x=>x.u?fk(x.r)+' '+x.u:(x.l>0?fk(x.r)+'×'+fk(x.l):fk(x.r)+' reps');
function sessionsOf(rows){
  const M={};rows.forEach(x=>{(M[x.id]=M[x.id]||[]).push(x);});
  return Object.keys(M).map(id=>({id:id,s:SM[id],rows:M[id].sort((a,b)=>a.j-b.j)})).sort((a,b)=>a.s.ts-b.s.ts||(a.id<b.id?-1:1));
}
function prHtml(id,i,n){

const pc=x=>{x=Math.round(x);return p2(Math.floor(x/60))+':'+p2(x%60)+'/km';};
function summary(w0){

      const k=pk(r.km),t=pt(r.t||''),pp=(r.pk||[]).slice(0,Math.ceil(k)),sp=pp.some(x=>x)?' · parciais por km: '+pp.map(x=>x||'-').join(' | '):'';
      L.push('CORRIDA '+s.date+' '+s.dn+' · '+s.t+' · plano '+s.k+' km @ '+s.p+(s.test?' [TESTE]':'')+' · '+(done?'concluída':'não marcada')+' · feito: '+(r.km||'-')+' km em '+(r.t||'-')+' · pace '+(k&&t?pc(t/k):'-')+sp);
    }else{
      const g=G[s.gym],ln=[];
      g[1].forEach((x,i)=>{const a=[];for(let j=0;j<x[1];j++){const v=st.gy[s.id+'|'+i+'|'+j];if(v&&(v[0]||v[1]))a.push((v[0]||'?')+(v[1]?'×'+v[1]:''));}

      if(!(done||ln.length))return;any=true;
      L.push('MUSCULAÇÃO '+s.date+' '+s.dn+' · Treino '+lab(s.gym)+' '+g[0]+' · '+(done?'concluído':'não marcado'));

/* ===== Importação do resumo em texto (usado também para carregar o histórico inicial) ===== */
const EQR={'halter':'h','máquina':'mq','polia':'po','barra':'b','corda':'c','máquina / polia':'m'};
function parseResumo(txt){
  const out={done:{},run:{},gy:{}},res={sess:0,sets:0,miss:[]};
  const hd=String(txt).match(/em (\d{2})\/(\d{2})\/(\d{4})/),ref=hd?new Date(+hd[3],+hd[2]-1,+hd[1]).getTime()+864e5:Date.now()+864e5;
  let s=null;
  String(txt).split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    const m=l.match(/^(CORRIDA|MUSCULAÇÃO) (\d{2})\/(\d{2})/);
    if(m){
      const run=m[1]==='CORRIDA',c=S.filter(x=>!!x.run===run&&x.date===m[2]+'/'+m[3]);
      const ok=c.filter(x=>x.ts<=ref);s=(ok.length?ok:c).sort((a,b)=>b.ts-a.ts)[0]||null;
      if(!s){res.miss.push(l.slice(0,40));return;}
      res.sess++;
      if(/·\s*conclu[íi]d[oa]/.test(l))out.done[s.id]=1;
      if(run){
        const f=l.match(/feito: ([\d.,-]+) km em ([\d:-]+)/),pp=l.match(/parciais por km: (.+)$/),r={};
        if(f){if(f[1]!=='-')r.km=f[1];if(f[2]!=='-')r.t=f[2];}
        if(pp)r.pk=pp[1].split('|').map(x=>x.trim()).map(x=>x==='-'?'':x);
        out.run[s.id]=r;
      }
      return;
    }
    const e=l.match(/^-\s*(.+?)(?:\s\[([^\]]+)\])?\s\(plano [^)]*\):\s*(.*)$/);
    if(e&&s&&s.gym){
      const i=G[s.gym][1].findIndex(x=>nm(x[0],s.w)===e[1].trim());
      if(i<0){res.miss.push(s.date+' '+e[1]);return;}
      e[3].split('|').map(x=>x.trim()).forEach((v,j)=>{if(!v)return;const p=v.split('×');out.gy[s.id+'|'+i+'|'+j]=[p[0].trim()==='?'?'':p[0].trim(),(p[1]||'').trim()];res.sets++;});
      if(e[2]){const q=e[2].trim().toLowerCase(),pa=EQR[q]?[q]:q.split(' + ');if(EQR[pa[0]])out.gy[s.id+'|'+i+'|eq']=EQR[pa[0]];if(pa[1]&&EQR[pa[1]])out.gy[s.id+'|'+i+'|eq2']=EQR[pa[1]];}
    }
  });
  res.out=out;return res;
}
function applyResumo(r){fix();Object.assign(st.done,r.out.done);Object.assign(st.run,r.out.run);Object.assign(st.gy,r.out.gy);}

/* ===== Backup e restauração ===== */
const isO=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
function backupObj(){return{app:'treino-dieta',format:1,appVersion:APP_VERSION,storageKey:KEY,exportedAt:new Date().toISOString(),data:st};}
function normalize(o){
  if(isO(o)&&o.app==='treino-dieta'){if(+o.format>1)throw new Error('Este backup é de uma versão mais nova do app. Atualize o app antes.');o=o.data;}
  else if(isO(o)&&typeof o.state==='string'){o=JSON.parse(o.state);}
  if(!isO(o)||!['done','run','gy'].some(k=>isO(o[k])))throw new Error('O arquivo não parece um backup do Treino & Dieta.');
  ['done','run','gy','diet','cfg','swap'].forEach(k=>{if(k in o&&!isO(o[k]))throw new Error('Campo "'+k+'" inválido no backup.');});
  if('wlog' in o&&!Array.isArray(o.wlog))throw new Error('Campo "wlog" inválido no backup.');
  if(o.wlog)o.wlog=o.wlog.filter(x=>isO(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&isFinite(+x.k)).map(x=>({d:x.d,k:+x.k}));
  return o;
}
function desc(o){
  const d=o.done||{},run=o.run||{},gy=o.gy||{};
  return Object.keys(d).filter(k=>d[k]).length+' treinos concluídos · '+Object.keys(run).filter(k=>run[k]&&(run[k].km||run[k].t)).length+' corridas com dados · '+Object.keys(gy).filter(k=>/\|\d+$/.test(k)).length+' séries · '+Object.keys(o.diet||{}).length+' dias de dieta · '+(o.wlog||[]).length+' pesos';
}
function keepPrev(){try{localStorage.setItem(KEY+'_prev',JSON.stringify(st));}catch(e){}}
function restoreObj(o){
  o=normalize(o);
  if(!confirm('Substituir TODOS os dados atuais por este backup?\n\nBackup: '+desc(o)+'\nAtual: '+desc(st)+'\n\nOs dados atuais ficam guardados e podem voltar com "Desfazer última restauração".'))return;
  keepPrev();st=Object.assign(DEF(),o);fix();
  if(ls()){vw=vd=dvw=dvd=null;closeModal();render();setStatus('Backup restaurado ✓');}
}
function markBk(){try{localStorage.setItem('td_lastBackup',String(Date.now()));}catch(e){}setStatus('Backup gerado ✓ '+hm());}
async function doExport(){
  const d=new Date(),name='treino-dieta-backup-'+iso(d)+'-'+p2(d.getHours())+p2(d.getMinutes())+'.json',txt=JSON.stringify(backupObj());
  let file=null;try{file=new File([txt],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBk();return;}}catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file||new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);markBk();
}
function bkAction(a){
  try{
    if(a==='exp')return doExport();
    if(a==='cpy'){const t=JSON.stringify(backupObj());(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{markBk();alert('Backup copiado. Cole em uma nota ou e-mail para guardar.');},()=>{markBk();showText(t,'Backup (JSON)');});return;}

    }
  }catch(e){alert('Não foi possível importar: '+(e&&e.message||e));}
}

  if(e.target.id!=='bkf'||!e.target.files||!e.target.files[0])return;
  const f=e.target.files[0],rd=new FileReader();
  rd.onload=()=>{try{restoreObj(JSON.parse(String(rd.result)));}catch(err){alert('Não foi possível importar: '+(err&&err.message||err));}e.target.value='';};
  rd.readAsText(f);
});
$('#sb').addEventListener('click',openB);
$('#cp').addEventListener('click',()=>doCopy());
$('#pf').addEventListener('click',openP);
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;view=b.dataset.v;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);render();});
$('#foods').innerHTML=FOODS.map(f=>'<option value="'+esc(f.n)+'">').join('');
L.addEventListener('change',e=>{if(e.target.classList.contains('pres')){dayOf(dkey()).p=e.target.checked?1:0;save();renderD();}});
L.addEventListener('input',e=>{if(e.target.classList.contains('xk')){e.target.value=e.target.value.replace(/[^\d]/g,'');e.target.classList.remove('bad');}});
L.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.xrow')){e.preventDefault();e.target.closest('.xtr').querySelector('.xadd').click();}});
L.addEventListener('click',e=>{
  const op=e.target.closest('.op');if(op){const m=op.closest('.meal').dataset.m,N=PM[m].o.length,d=dayOf(dkey());d.pl=d.pl||{};d.pl[m]={o:(optIdx(m,dnum())+(+op.dataset.d)+N)%N};save();renderD();return;}
  const ea=e.target.closest('.eat');if(ea){const m=ea.closest('.meal').dataset.m,d=dayOf(dkey()),oi=optIdx(m,dnum());d.pl=d.pl||{};const q=d.pl[m];
    if(q&&q.ok)d.pl[m]={o:oi};else d.pl[m]={o:oi,ok:1,it:planDay(dnum(),targets(new Date(2026,9,5+dnum())))[m]};save();renderD();return;}
  const xa=e.target.closest('.xadd,.xq');if(xa){const card=xa.closest('.xtr'),nI=card.querySelector('.xn'),k=xa.classList.contains('xq')?+xa.dataset.k:parseFloat(card.querySelector('.xk').value.replace(',','.'));
    if(!(k>0&&k<10000)){card.querySelector('.xk').classList.add('bad');return;}const d=dayOf(dkey());(d.x=d.x||[]).push({n:nI.value.trim().slice(0,60),k:Math.round(k)});save();renderD();return;}
  const xd=e.target.closest('.xdel');if(xd){const d=dayOf(dkey());d.x.splice(+xd.dataset.i,1);save();renderD();return;}
  const pd=e.target.closest('.pdel');if(pd){delete st.diet[dkey()].pl[pd.dataset.m];save();renderD();return;}
  const x=e.target.closest('.fdel');if(x){st.diet[dkey()].m[x.dataset.m].splice(+x.dataset.i,1);save();renderD();return;}
  if(e.target.closest('.ftab')){openFoods();}
});

/* ===== Inicialização ===== */
$('#ft').textContent='Treino & Dieta v'+APP_VERSION+' · salvo automaticamente neste aparelho. Faça backup em 💾 Backup.';
if(fresh){fix();const r=parseResumo(SEED);applyResumo(r);save();setStatus('Histórico inicial carregado: '+r.sess+' treinos');}
render();
if(!fresh){const lb=+localStorage.getItem('td_lastBackup')||0;if(!lb||Date.now()-lb>7*864e5)setStatus('Lembrete: faça um backup (💾)',1);}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
window.TD={st:()=>st,S:S,parseResumo:parseResumo,gymRows:gymRows,summary:summary,normalize:normalize,version:APP_VERSION,targets:targets,planDay:planDay,jCarb:jCarb,sessOn:sessOn,optIdx:optIdx,PF:PF,PM:PM,goDay:n=>{dvw=Math.floor(n/7);dvd=n-dvw*7;renderD();}};
})();
</script>
